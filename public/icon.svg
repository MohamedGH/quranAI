<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1726" />
      <stop offset="50%" stop-color="#111d2e" />
      <stop offset="100%" stop-color="#070c14" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceda2" />
      <stop offset="40%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72f1dc" />
      <stop offset="100%" stop-color="#3eb8a0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />
  <rect width="500" height="500" x="6" y="6" rx="102" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.4" />

  <!-- Outer Arabesque Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.3" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#teal)" stroke-width="1.5" opacity="0.4" />

  <!-- Quranic Book Rihan / Stand -->
  <g transform="translate(256, 256)">
    <!-- Crescent & Star -->
    <path d="M 0 -85 A 45 45 0 1 0 35 -15 A 36 36 0 1 1 5 -75 A 45 45 0 0 0 0 -85 Z" fill="url(#gold)" />
    <polygon points="26,-64 30,-54 40,-54 32,-48 35,-38 26,-44 17,-38 20,-48 12,-54 22,-54" fill="url(#teal)" />

    <!-- Open Quran Book Leaves -->
    <!-- Left Page -->
    <path d="M -8 -10 C -50 -35 -115 -25 -145 15 C -145 75 -145 95 -145 105 C -115 70 -50 60 -8 80 Z" fill="url(#gold)" opacity="0.95" />
    <!-- Left Page Inner Lines -->
    <path d="M -30 10 C -60 -5 -105 2 -125 25 M -30 30 C -60 15 -105 22 -125 45 M -30 50 C -60 35 -105 42 -125 65" fill="none" stroke="#0e1724" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Right Page -->
    <path d="M 8 -10 C 50 -35 115 -25 145 15 C 145 75 145 95 145 105 C 115 70 50 60 8 80 Z" fill="url(#gold)" opacity="0.95" />
    <!-- Right Page Inner Lines -->
    <path d="M 30 10 C 60 -5 105 2 125 25 M 30 30 C 60 15 105 22 125 45 M 30 50 C 60 35 105 42 125 65" fill="none" stroke="#0e1724" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Central Spine Bookmark -->
    <path d="M -7 75 L 0 135 L 7 75 Z" fill="url(#teal)" />

    <!-- Rihal Wooden Stand Legs -->
    <path d="M -90 90 L -120 145 L -85 145 L -60 100 Z" fill="url(#gold)" opacity="0.75" />
    <path d="M 90 90 L 120 145 L 85 145 L 60 100 Z" fill="url(#gold)" opacity="0.75" />
    <path d="M -45 100 L 0 145 L 45 100 L 25 90 L 0 115 L -25 90 Z" fill="url(#gold)" opacity="0.85" />
  </g>
</svg>
